<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario SSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Editar Usuario</h1>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary mb-3">Volver</a>
        
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Nueva Contraseña (dejar vacío para no cambiar)</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rol_admin" name="rol_admin" {% if user.rol_admin %}checked{% endif %}>
                <label class="form-check-label" for="rol_admin">Rol Admin</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rol_ordenes" name="rol_ordenes" {% if user.rol_ordenes %}checked{% endif %}>
                <label class="form-check-label" for="rol_ordenes">Acceso a Órdenes</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rol_fibra" name="rol_fibra" {% if user.rol_fibra %}checked{% endif %}>
                <label class="form-check-label" for="rol_fibra">Acceso a Fibra</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rol_flota" name="rol_flota" {% if user.rol_flota %}checked{% endif %}>
                <label class="form-check-label" for="rol_flota">Acceso a Flota</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rol_herramientas" name="rol_herramientas" {% if user.rol_herramientas %}checked{% endif %}>
                <label class="form-check-label" for="rol_herramientas">Acceso a Herramientas</label>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar Usuario</button>
        </form>
    </div>
</body>
</html>
